<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a1a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#fg)" stroke-width="1.5" opacity="0.6"/>

  <!-- Compact car-shaped ACR -->
  <g filter="url(#glow)" transform="translate(5,8)">
    <!-- A — hood -->
    <polygon points="10,46 2,46 12,10 16,10 26,46 22,46 20,38 8,38"
             fill="none" stroke="url(#fg)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="9" y1="40" x2="19" y2="40" stroke="url(#fg)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Front wheel -->
    <circle cx="7" cy="46" r="2.5" fill="#0a0a1a" stroke="#00f0ff" stroke-width="1.3"/>

    <!-- C — cabin roofline -->
    <path d="M30,46 L30,18 Q30,10 37,10 L44,10 Q50,10 50,18"
          fill="none" stroke="url(#fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- R — rear -->
    <line x1="54" y1="10" x2="54" y2="46" stroke="url(#fg)" stroke-width="2" stroke-linecap="round"/>
    <path d="M54,10 L62,10 Q68,10 68,17 Q68,24 62,24 L54,24"
          fill="none" stroke="url(#fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="60" y1="24" x2="68" y2="42" stroke="url(#fg)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rear wheel -->
    <circle cx="64" cy="46" r="2.5" fill="#0a0a1a" stroke="#ff00ea" stroke-width="1.3"/>

    <!-- Road -->
    <line x1="2" y1="48" x2="70" y2="48" stroke="url(#fg)" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
  </g>
</svg>
