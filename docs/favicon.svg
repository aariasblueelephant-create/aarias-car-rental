<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8ecf1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0c8d4"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f1218"/>

  <!-- Car-shaped ACR compact -->
  <g filter="url(#glow)" transform="translate(3,8)">
    <!-- A = hood -->
    <path d="M4,44 L14,44 L22,14 L26,14 L34,38" fill="none" stroke="url(#fg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="16" y1="32" x2="30" y2="32" stroke="url(#fg)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Headlight -->
    <circle cx="7" cy="41" r="1.5" fill="url(#red)"/>

    <!-- C = roofline -->
    <path d="M34,38 Q36,10 44,10 L50,10 Q56,10 56,22" fill="none" stroke="url(#fg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- R = rear -->
    <line x1="60" y1="10" x2="60" y2="44" stroke="url(#fg)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M60,10 Q72,10 72,17 Q72,24 60,24" fill="none" stroke="url(#fg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="64" y1="24" x2="72" y2="40" stroke="url(#fg)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Tail light -->
    <rect x="70" y="36" width="3" height="2" rx="0.5" fill="url(#red)"/>

    <!-- Wheels -->
    <circle cx="14" cy="46" r="3.5" fill="#0f1218" stroke="#999" stroke-width="1.5"/>
    <circle cx="14" cy="46" r="1.2" fill="#666"/>
    <circle cx="66" cy="46" r="3.5" fill="#0f1218" stroke="#999" stroke-width="1.5"/>
    <circle cx="66" cy="46" r="1.2" fill="#666"/>

    <!-- Road -->
    <line x1="2" y1="50" x2="76" y2="50" stroke="#555" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 2"/>
  </g>
</svg>
