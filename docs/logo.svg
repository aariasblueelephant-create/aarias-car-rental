<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="280" height="48">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <filter id="nGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Badge background -->
  <rect x="4" y="6" width="44" height="44" rx="12" fill="#0a0a1a" stroke="url(#neonGrad)" stroke-width="1.5"/>
  <!-- Monogram A -->
  <text x="26" y="38" text-anchor="middle" font-family="Poppins, Georgia, serif" font-weight="800" font-size="30" fill="url(#neonGrad)" filter="url(#nGlow)" letter-spacing="-1">A</text>
  <!-- Brand name -->
  <text x="58" y="25" font-family="Poppins, sans-serif" font-weight="800" font-size="19" fill="url(#neonGrad)" filter="url(#softGlow)" letter-spacing="-0.3">ACRMS</text>
  <!-- Tagline with thin tracking -->
  <text x="59" y="41" font-family="Poppins, sans-serif" font-weight="400" font-size="9" fill="#6a7a9a" letter-spacing="2.8">AARIAS CAR RENTAL</text>
  <!-- Decorative underline -->
  <line x1="58" y1="45" x2="220" y2="45" stroke="url(#neonGrad)" stroke-width="0.8" opacity="0.5"/>
</svg>
