<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a1a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#fg)" stroke-width="1.5" opacity="0.6"/>
  <!-- Car key — tilted 45° for dynamic look -->
  <g filter="url(#glow)" transform="translate(32,32) rotate(-45) translate(-16,-24)">
    <!-- Bow (handle ring) -->
    <rect x="4" y="2" width="24" height="20" rx="7" fill="none" stroke="url(#fg)" stroke-width="3.2"/>
    <!-- Keyhole -->
    <circle cx="16" cy="10" r="3" fill="url(#fg)" opacity="0.8"/>
    <rect x="14.5" y="12" width="3" height="5" rx="0.8" fill="url(#fg)" opacity="0.8"/>
    <!-- Shaft -->
    <line x1="16" y1="22" x2="16" y2="46" stroke="url(#fg)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Teeth -->
    <line x1="16" y1="34" x2="23" y2="34" stroke="url(#fg)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="23" y1="34" x2="23" y2="38" stroke="url(#fg)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="23" y1="38" x2="16" y2="38" stroke="url(#fg)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="16" y1="42" x2="21" y2="42" stroke="url(#fg)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="21" y1="42" x2="21" y2="46" stroke="url(#fg)" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
