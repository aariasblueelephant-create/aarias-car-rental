<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="280" height="56">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8ecf1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0c8d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feFlood flood-color="#ffffff" flood-opacity="0.15" result="c"/><feComposite in="c" in2="b" operator="in" result="d"/><feMerge><feMergeNode in="d"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!--
    The three letters A-C-R flow together to form a single car profile:
    A = front grille + hood slope
    C = roofline cabin arc
    R = rear trunk + spoiler
  -->
  <g filter="url(#glow)" transform="translate(6,3)">

    <!-- === Car body outline — one continuous path shaped by the letters === -->
    <!-- Hood / "A" region -->
    <!--   The A's left leg is the front bumper, peak is the hood tip,
           right leg descends into the windshield base -->
    <path d="
      M 4,46
      L 16,46
      L 30,12
      L 36,12
      L 48,40
    " fill="none" stroke="url(#carGrad)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- A crossbar = grille -->
    <line x1="20" y1="34" x2="40" y2="34" stroke="url(#carGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Headlight -->
    <circle cx="8" cy="42" r="2" fill="url(#accentGrad)"/>

    <!-- Roofline / "C" region -->
    <!--   C opens to the right = cabin arc sweeping up and over -->
    <path d="
      M 48,40
      Q 50,10  68,10
      L 82,10
      Q 96,10  96,26
    " fill="none" stroke="url(#carGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Window pane inside C -->
    <path d="
      M 54,34
      Q 56,16  68,16
      L 78,16
      Q 88,16  88,28
    " fill="none" stroke="url(#carGrad)" stroke-width="1" opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rear / "R" region -->
    <!--   R's stem = rear pillar, bowl = trunk curve, kick leg = spoiler -->
    <line x1="102" y1="10" x2="102" y2="46" stroke="url(#carGrad)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M102,10 Q124,10 124,20 Q124,30 102,30" fill="none" stroke="url(#carGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Kick leg = spoiler -->
    <line x1="110" y1="30" x2="128" y2="46" stroke="url(#carGrad)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Tail light -->
    <rect x="124" y="38" width="5" height="3" rx="1" fill="url(#accentGrad)"/>

    <!-- Wheels -->
    <circle cx="18" cy="48" r="5" fill="#1a1a2e" stroke="#888" stroke-width="1.8"/>
    <circle cx="18" cy="48" r="2" fill="#555"/>
    <circle cx="116" cy="48" r="5" fill="#1a1a2e" stroke="#888" stroke-width="1.8"/>
    <circle cx="116" cy="48" r="2" fill="#555"/>

    <!-- Road -->
    <line x1="0" y1="53" x2="134" y2="53" stroke="#444" stroke-width="1" opacity="0.4" stroke-linecap="round" stroke-dasharray="4 3"/>
  </g>

  <!-- Brand text -->
  <text x="154" y="24" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#e8ecf1" letter-spacing="4">ACR</text>
  <text x="154" y="38" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="400" font-size="6.5" fill="#6a7a8a" letter-spacing="2">AARIAS CAR RENTAL</text>
  <line x1="154" y1="43" x2="256" y2="43" stroke="#888" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
</svg>
