<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="280" height="52">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <filter id="nGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Badge pill -->
  <rect x="2" y="2" width="146" height="52" rx="14" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="1.2"/>

  <!-- Car-shaped ACR -->
  <g filter="url(#nGlow)" transform="translate(10,4)">
    <!-- Ground line / road -->
    <line x1="6" y1="44" x2="128" y2="44" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

    <!-- "A" — shaped as the sloping hood & front of a car -->
    <polygon points="18,42 4,42 20,6 26,6 42,42 36,42 32,32 12,32"
             fill="none" stroke="url(#neonGrad)" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- A crossbar shaped like a bumper/grille -->
    <line x1="14" y1="34" x2="30" y2="34" stroke="url(#neonGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Front wheel -->
    <circle cx="12" cy="42" r="3.5" fill="#0a0a1a" stroke="#00f0ff" stroke-width="1.8"/>
    <circle cx="12" cy="42" r="1" fill="#00f0ff"/>

    <!-- "C" — the cabin arc / roofline -->
    <path d="M52,42 L52,16 Q52,6 62,6 L76,6 Q86,6 86,16"
          fill="none" stroke="url(#neonGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Windshield line -->
    <line x1="58" y1="18" x2="58" y2="36" stroke="url(#neonGrad)" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    <!-- Rear window line -->
    <line x1="76" y1="12" x2="76" y2="24" stroke="url(#neonGrad)" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>

    <!-- "R" — the rear end with a spoiler kick -->
    <!-- Stem -->
    <line x1="96" y1="6" x2="96" y2="42" stroke="url(#neonGrad)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Bowl -->
    <path d="M96,6 L112,6 Q122,6 122,16 Q122,26 112,26 L96,26"
          fill="none" stroke="url(#neonGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Kick leg = exhaust / spoiler -->
    <line x1="106" y1="26" x2="126" y2="42" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rear wheel -->
    <circle cx="120" cy="42" r="3.5" fill="#0a0a1a" stroke="#ff00ea" stroke-width="1.8"/>
    <circle cx="120" cy="42" r="1" fill="#ff00ea"/>

    <!-- Speed lines behind -->
    <line x1="0" y1="24" x2="8" y2="24" stroke="#00f0ff" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
    <line x1="-2" y1="30" x2="8" y2="30" stroke="#7b61ff" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
    <line x1="0" y1="36" x2="6" y2="36" stroke="#ff00ea" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Tagline to the right -->
  <text x="158" y="22" font-family="Poppins, sans-serif" font-weight="700" font-size="11" fill="url(#neonGrad)" letter-spacing="3">ACR</text>
  <text x="158" y="34" font-family="Poppins, sans-serif" font-weight="400" font-size="6.5" fill="#6a7a9a" letter-spacing="2">AARIAS CAR RENTAL</text>
  <line x1="158" y1="40" x2="260" y2="40" stroke="url(#neonGrad)" stroke-width="0.5" opacity="0.3" stroke-linecap="round"/>
</svg>
