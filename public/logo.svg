<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="280" height="52">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <filter id="nGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Badge pill -->
  <rect x="2" y="4" width="138" height="48" rx="14" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="1.2"/>

  <!-- Horizontal car key -->
  <g filter="url(#nGlow)" transform="translate(8,8)">
    <!-- Key bow — rounded rectangle handle -->
    <rect x="4" y="6" width="30" height="28" rx="8" fill="none" stroke="url(#neonGrad)" stroke-width="3"/>
    <!-- Keyhole in bow -->
    <circle cx="19" cy="17" r="4" fill="url(#neonGrad)" opacity="0.7"/>
    <rect x="17" y="19" width="4" height="6" rx="1" fill="url(#neonGrad)" opacity="0.7"/>
    <!-- ACR text engraved in bow -->
    <text x="19" y="35" font-family="Poppins, sans-serif" font-weight="700" font-size="5.5" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="0.8" opacity="0.9">ACR</text>
    <!-- Key shaft -->
    <line x1="34" y1="20" x2="90" y2="20" stroke="url(#neonGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Key blade / ward cuts -->
    <line x1="62" y1="20" x2="62" y2="30" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="30" x2="72" y2="30" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="30" x2="72" y2="20" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="20" x2="78" y2="28" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="28" x2="84" y2="28" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="28" x2="84" y2="20" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="20" x2="90" y2="26" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Key ring hole -->
    <circle cx="10" cy="14" r="3" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Tagline -->
  <text x="154" y="22" font-family="Poppins, sans-serif" font-weight="700" font-size="11" fill="url(#neonGrad)" letter-spacing="3">ACR</text>
  <text x="154" y="34" font-family="Poppins, sans-serif" font-weight="500" font-size="7" fill="#8a9abb" letter-spacing="1.5">AARIAS CAR RENTAL</text>
  <line x1="154" y1="40" x2="266" y2="40" stroke="url(#neonGrad)" stroke-width="0.6" opacity="0.35" stroke-linecap="round"/>
</svg>
